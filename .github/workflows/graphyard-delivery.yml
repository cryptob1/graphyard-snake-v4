name: Graphyard delivery
# Written by graphyard init --scan --apply because no workflow of this repository ran on pull requests.
# Edit the build and test commands freely (a rerun keeps your edits); graphyard-gate passes only when both jobs passed.
on:
  pull_request:
  push:
    branches: ["main"]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check game page and inline JavaScript
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { Script } from 'node:vm';
          import assert from 'node:assert/strict';
          const html = readFileSync('index.html', 'utf8');
          assert.match(html, /^\s*<!doctype html>/i);
          assert.match(html, /<html\b[^>]*>[\s\S]*<head\b[^>]*>[\s\S]*<\/head\s*>[\s\S]*<body\b[^>]*>[\s\S]*<\/body\s*>\s*<\/html\s*>\s*$/i);
          assert.match(html, /<canvas\b[^>]*id="board"/i);
          assert.match(html, /id="score"/i);
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script\s*>/gi)];
          assert.equal(scripts.length, 1, 'expected one complete inline script');
          assert.ok(scripts[0][1].trim(), 'inline script is empty');
          new Script(scripts[0][1], { filename: 'index.html inline script' });
          NODE
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test tests/snake.test.mjs
  graphyard-gate:
    needs: [build, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "$BUILD" = success && test "$TEST" = success
        env:
          BUILD: ${{ needs.build.result }}
          TEST: ${{ needs.test.result }}
