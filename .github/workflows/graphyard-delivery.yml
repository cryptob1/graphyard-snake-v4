name: Graphyard delivery
# Written by graphyard init --scan --apply because no workflow of this repository ran on pull requests.
# Edit the build and test commands freely (a rerun keeps your edits); graphyard-gate passes only when both jobs passed.
on:
  pull_request:
  push:
    branches: ["main"]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      # No build step: the game is plain static files. Sanity-check that the page
      # exists and every JavaScript file parses.
      - run: test -f index.html && for f in $(git ls-files 'js/*.js' 'tests/*.js'); do node --check "$f"; done
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 26: `node --test DIR` runs every test file under DIR (Node 22 and 24 do not accept a directory).
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - run: node --test tests/
  graphyard-gate:
    needs: [build, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "$BUILD" = success && test "$TEST" = success
        env:
          BUILD: ${{ needs.build.result }}
          TEST: ${{ needs.test.result }}
  # On push to main, publish the repository root (index.html, css, js) as-is to
  # GitHub Pages: no build step, no dependencies installed. The publish pushes over
  # SSH with the repository's provisioned deploy key (repository secret DEPLOY_KEY,
  # the private half of a read-write deploy key) to the gh-pages branch, which
  # GitHub Pages serves from its root.
  deploy:
    needs: [build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - run: test -n "$DEPLOY_KEY" || { echo "::error::The DEPLOY_KEY repository secret (the provisioned deploy key) is not set"; exit 1; }
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
      # Commit the checked-out tree (plus .nojekyll, so Pages serves the files untouched)
      # as the sole commit of gh-pages and push it over the deploy key.
      - run: |
          touch .nojekyll
          git add -f .nojekyll
          commit=$(git commit-tree "$(git write-tree)" -m "Publish $GITHUB_SHA to GitHub Pages")
          git push --force origin "$commit:refs/heads/gh-pages"
        env:
          GIT_AUTHOR_NAME: graphyard-deploy
          GIT_AUTHOR_EMAIL: graphyard-deploy@users.noreply.github.com
          GIT_COMMITTER_NAME: graphyard-deploy
          GIT_COMMITTER_EMAIL: graphyard-deploy@users.noreply.github.com
