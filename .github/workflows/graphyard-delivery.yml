name: Graphyard delivery
# Written by graphyard init --scan --apply because no workflow of this repository ran on pull requests.
# Edit the build and test commands freely (a rerun keeps your edits); graphyard-gate passes only when both jobs passed.
on:
  pull_request:
  push:
    branches: ["main"]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      # No build step: the game is plain static files. Sanity-check that the page
      # exists and every JavaScript file parses.
      - run: test -f index.html && for f in $(git ls-files 'js/*.js' 'tests/*.js'); do node --check "$f"; done
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 26: `node --test DIR` runs every test file under DIR (Node 22 and 24 do not accept a directory).
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - run: node --test tests/
  graphyard-gate:
    needs: [build, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "$BUILD" = success && test "$TEST" = success
        env:
          BUILD: ${{ needs.build.result }}
          TEST: ${{ needs.test.result }}
  # On push to main, publish the repository root (index.html, css, js) as-is to
  # GitHub Pages with the official Pages actions: no build step, no dependencies,
  # no repository secret and no branch push. The repository's Pages source is
  # "GitHub Actions", which serves the artifact actions/deploy-pages deploys,
  # authenticated by the job's own OIDC token (id-token: write) and pages: write.
  deploy:
    needs: [build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
