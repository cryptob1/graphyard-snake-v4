<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="game">
    <h1>Snake</h1>
    <div class="hud">
      <span id="score" class="score" aria-live="polite">Score 0</span>
      <span id="best" class="best">Best 0</span>
    </div>
    <canvas id="board" class="board" width="400" height="400" aria-label="Snake play area"></canvas>
    <div id="game-over" class="game-over" role="status" hidden>
      <p class="game-over-title">Game over</p>
      <p class="game-over-score">Final score: <span id="final-score">0</span></p>
      <button id="play-again" class="start play-again" type="button">Play again</button>
    </div>
    <button id="start" class="start" type="button">Start</button>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
